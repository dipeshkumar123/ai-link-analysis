[project]
name = "ai-link-analysis"
version = "1.0.0"
description = "AI-powered website link analysis API built with FastAPI and LLMs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dipesh Kumar Panjiyar" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
